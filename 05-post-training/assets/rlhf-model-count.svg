<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-labelledby="title desc">
  <title id="title">Two decisions: update method and feedback source</title>
  <desc id="desc">PPO, GRPO, and DPO construct updates differently. Learned rewards and verifiable rewards can be used with online policy optimization. Offline DPO uses preference pairs. These are logical roles, not a count of resident models.</desc>
  <style>
    :root { --paper: #faf9f6; --panel: #fff; --ink: #252a30; --muted: #59636b; --line: #d4d9dc; --blue: #315e79; --tint: #eef3f5; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #16191e; --panel: #20252c; --ink: #e9ecee; --muted: #afb8c0; --line: #3c454f; --blue: #95c6e0; --tint: #24323b; }
    }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: var(--ink); font-size: 15px; }
    .heading { font-size: 20px; font-weight: 650; }
    .label { font-size: 12px; font-weight: 650; letter-spacing: 1.1px; fill: var(--muted); }
    .muted { fill: var(--muted); font-size: 13px; }
    .method { font-size: 18px; font-weight: 650; fill: var(--blue); }
    .panel { fill: var(--panel); stroke: var(--line); }
  </style>
  <rect width="760" height="432" rx="14" fill="var(--paper)"/>
  <text x="26" y="36" class="heading">Different choices, not a model-count ladder</text>
  <text x="26" y="66" class="label">1 / HOW DOES THE POLICY LEARN?</text>
  <rect x="26" y="82" width="222" height="148" rx="9" class="panel"/>
  <rect x="268" y="82" width="222" height="148" rx="9" class="panel"/>
  <rect x="510" y="82" width="224" height="148" rx="9" class="panel"/>
  <text x="42" y="112" class="method">PPO</text>
  <text x="42" y="143">Sample → score → update</text>
  <text x="42" y="169">Value-based advantages</text>
  <text x="42" y="211" class="muted">Usually trains a Critic</text>
  <text x="284" y="112" class="method">GRPO</text>
  <text x="284" y="143">Sample a group → score</text>
  <text x="284" y="169">Within-group advantages</text>
  <text x="284" y="211" class="muted">No separate trained Critic</text>
  <text x="526" y="112" class="method">Offline DPO</text>
  <text x="526" y="143">Preferred / rejected pairs</text>
  <text x="526" y="169">Direct preference loss</text>
  <text x="526" y="211" class="muted">No training-loop rollout</text>
  <text x="26" y="268" class="label">2 / WHERE DOES THE FEEDBACK COME FROM?</text>
  <rect x="26" y="284" width="464" height="96" rx="9" fill="var(--tint)" stroke="var(--line)"/>
  <rect x="510" y="284" width="224" height="96" rx="9" class="panel"/>
  <text x="42" y="313">Learned reward OR verifiable reward</text>
  <text x="42" y="340" class="muted">RLVR names the verifier-based feedback choice.</text>
  <text x="42" y="361" class="muted">It does not prescribe PPO vs. GRPO.</text>
  <text x="526" y="313">Preference labels</text>
  <text x="526" y="340" class="muted">Human or other judges;</text>
  <text x="526" y="361" class="muted">audit their quality too.</text>
  <text x="26" y="410" class="muted">Caching, sharing, and offloading change memory use. Count costs, not just roles.</text>
</svg>
