# I maintain this file myself. Your name shows up on the contributors page on its
# own, so there is nothing to sign up for; the only extra kept here is an optional
# country or region, which lights one patch of the world map.
#
# To be on it, open an issue ("Add me to the crew"). I read them from time to time
# and add people by hand. PRs that edit this file are not merged — this is a column
# someone has to keep an eye on.
#
# country: ISO 3166-1 alpha-2 — CN, US, SG, GB, JP …

