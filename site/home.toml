# The home page: the cover (build.py hero_html) and the blocks below it (home_html). README.md and
# README.zh.md expand <!-- widget:home --> into the blocks; GitHub shows the README sections instead
# (they are marked repository-only for the site).
#
# Links are source paths, as in the notes (`interview/study-plan.md`); the build points them at
# the page in the reader's language. Counts are never written here: the number of tracks and stops
# comes from site/nav.toml, the questions from the question bank, the moments from the Tech history
# data. The numbers of the first calculation are computed from [example] below, and a test checks
# that interview/speedrun-start(.en).md still works through the same inputs, targets and steps.

[cover]   # under the title on the night sky
eyebrow_zh = "Cooking AGI · 中英文学习笔记"
eyebrow_en = "Cooking AGI · Notes in English and Chinese"
title_zh = ["从模型原理，", "到完整的 AI 系统。"]
title_en = ["Understand the model.", "See the whole system."]
intro_zh = ["补基础、准备面试，或做一个项目。", "把散在各处的知识，放到一起慢慢讲清楚。"]
intro_en = ["Foundations, interview practice, and working systems.", "One place to work through the ideas and the details."]
search_zh = "搜索笔记：概念、模型或一道题"
search_en = "Search notes: a concept, a model, or a question"
# three ways in for a first visit; a returning reader sees where they were instead (reader-hub.js)
ways_zh = "第一次来？从这三条路开始。"
ways_en = "New here? Start one of three ways."
reading_zh = "正在读中文版"
reading_en = "Reading in English"

[[cover.way]]
href = "interview/speedrun-start.md"
title_zh = "从一个小模型开始"
title_en = "From one small model"
text_zh = "先弄清参数、loss 和梯度，再读 Transformer。会一点 Python 就够。"
text_en = "Parameters, loss and gradients first, then the Transformer. Some Python is all you need."

[[cover.way]]
href = "learn/README.md#tracks"
title_zh = "选一条学习线"
title_en = "Pick a track"
text_zh = "{tracks} 条线、{stops} 站，从 token 一路读到机器人。一站讲一个概念。"
text_en = "{tracks} tracks and {stops} stops, from tokens to robots. Each stop is one idea."

[[cover.way]]
href = "interview/speedrun.md"
title_zh = "快面试了"
title_en = "Interview soon"
text_zh = "按手上的时间排好复习：写代码、排错、讲原理、讲项目。"
text_en = "Review sized to the time you have: write code, debug, explain, and talk through a project."

[example]
zh = "先算一次"
en = "Try the first calculation"
text_zh = "起步路线的第一个算例：一个参数、两个样本。预测、算 loss、更新参数，三步就是一次训练。"
text_en = "The first example in Starting out: one parameter and two examples. Predict, take the loss, update the weight: that is one training step."
inputs = [1, 2]
targets = [2, 4]
weight = 1
rates = [0.1, 1]          # the lesson's step, then the one it warns about
lesson = "interview/speedrun-start.md#prediction"
update = "interview/speedrun-start.md#update"
steps_zh = ["预测", "算 loss", "更新参数"]
steps_en = ["Predict", "Loss", "Update"]
columns_zh = ["输入", "目标", "预测", "误差的平方"]
columns_en = ["Input", "Target", "Prediction", "Squared error"]
rule_zh = "预测 = weight × 输入"
rule_en = "prediction = weight × input"
loss_zh = "loss = 误差平方的平均"
loss_en = "loss = mean of the squared errors"
gradient_zh = "梯度 = 每个样本 2 × (预测 − 目标) × 输入 的平均"
gradient_en = "gradient = mean of 2 × (prediction − target) × input"
step_rule_zh = "新参数 = 旧参数 − 学习率 × 梯度"
step_rule_en = "new weight = old weight − learning rate × gradient"
rate_zh = "学习率"
rate_en = "Learning rate"
better_zh = "loss 变小了：在训练数据上更合适了。"
better_en = "Loss went down: the weight fits the training data better."
worse_zh = "步子太大，越过了最低点，loss 反而变大。"
worse_en = "The step is too large: it overshoots, and loss goes up."
next_zh = ["下一步：算 loss", "下一步：更新参数", "从头再来"]
next_en = ["Next: take the loss", "Next: update the weight", "Start over"]
curve_zh = "loss 随 weight 的变化"
curve_en = "Loss against weight"
slope_zh = "斜率"
slope_en = "slope"
axis_zh = ["weight", "loss"]
axis_en = ["weight", "loss"]
caption_zh = "数字和起步路线里的算例一致；梯度这一步的推导见[为什么往这个方向改](interview/speedrun-start.md#update)。"
caption_en = "The numbers are the worked example in Starting out; the gradient step is derived in [why the weight moves this way](interview/speedrun-start.md#update)."
read_zh = "读这一课"
read_en = "Read the lesson"

