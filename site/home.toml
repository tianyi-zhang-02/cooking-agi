# The first calculation of 「起步路线」 / "Starting out", to try on the page: predict, take the loss,
# update the weight. The model is prediction = weight × input with a mean squared error, as in the lesson.
# Without JavaScript the page shows all three steps worked out; static/home-example.js steps through them.
[example]
zh = "先算一次"
en = "Try the first calculation"
text_zh = "起步路线的第一个算例：一个参数、两个样本。预测、算 loss、更新参数，三步就是一次训练。"
text_en = "The first example in Starting out: one parameter and two examples. Predict, take the loss, update the weight: that is one training step."
inputs = [1, 2]
targets = [2, 4]
weight = 1
rates = [0.1, 1]          # the lesson's step, then the one it warns about
lesson = "interview/speedrun-start.md#prediction"
update = "interview/speedrun-start.md#update"
steps_zh = ["预测", "算 loss", "更新参数"]
steps_en = ["Predict", "Loss", "Update"]
columns_zh = ["输入", "目标", "预测", "误差的平方"]
columns_en = ["Input", "Target", "Prediction", "Squared error"]
rule_zh = "预测 = weight × 输入"
rule_en = "prediction = weight × input"
loss_zh = "loss = 误差平方的平均"
loss_en = "loss = mean of the squared errors"
gradient_zh = "梯度 = 每个样本 2 × (预测 − 目标) × 输入 的平均"
gradient_en = "gradient = mean of 2 × (prediction − target) × input"
step_rule_zh = "新参数 = 旧参数 − 学习率 × 梯度"
step_rule_en = "new weight = old weight − learning rate × gradient"
rate_zh = "学习率"
rate_en = "Learning rate"
better_zh = "loss 变小了：在训练数据上更合适了。"
better_en = "Loss went down: the weight fits the training data better."
worse_zh = "步子太大，越过了最低点，loss 反而变大。"
worse_en = "The step is too large: it overshoots, and loss goes up."
next_zh = ["下一步：算 loss", "下一步：更新参数", "从头再来"]
next_en = ["Next: take the loss", "Next: update the weight", "Start over"]
curve_zh = "loss 随 weight 的变化"
curve_en = "Loss against weight"
slope_zh = "斜率"
slope_en = "slope"
axis_zh = ["weight", "loss"]
axis_en = ["weight", "loss"]
caption_zh = "数字和起步路线里的算例一致；梯度这一步的推导见[为什么往这个方向改](interview/speedrun-start.md#update)。"
caption_en = "The numbers are the worked example in Starting out; the gradient step is derived in [why the weight moves this way](interview/speedrun-start.md#update)."
read_zh = "读这一课"
read_en = "Read the lesson"

