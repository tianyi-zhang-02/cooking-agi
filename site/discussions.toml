[[topic]]
slug = "your-own-path"
number = 52
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "人生不是一条赛道"
title_en = "Life is not one race"
tag_zh = "比较与自己的路"
tag_en = "Comparison & choosing a path"
summary_zh = "出身不同，背着的东西不同，想去的方向也不同。要经过同一套筛选，不代表要过同一种人生。"
summary_en = "Different backgrounds, responsibilities, and destinations. Facing the same selection systems doesn't mean wanting the same life."

[[topic]]
slug = "kindness-and-probability"
number = 51
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "行善这件事，大数定律管不管？"
title_en = "Can the law of large numbers explain kindness?"
tag_zh = "一点数学歪解"
tag_en = "A playful mathematical detour"
summary_zh = "大数定律不负责报恩。拿一个 Markov 玩具模型，聊聊善意、长期相处，还有不能删掉的「拒绝」按钮。"
summary_en = "No karmic refunds from the law of large numbers. A Markov toy model for kindness, repeated interactions, and the option to say no."

[[topic]]
slug = "endings"
number = 50
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "结局就是结局"
title_en = "An ending can be an ending"
tag_zh = "结局与执念"
tag_en = "Endings & attachment"
summary_zh = "灯灭了，香味也散去了。会不会重逢，有没有后续，可以不再那么重要。"
summary_en = "The lights are off. The scent has faded. Whether there is another meeting or another chapter can matter a little less."

[[topic]]
slug = "earning-and-enough"
number = 49
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "再多赚一点，要拿什么来换？"
title_en = "Earning more: what am I trading for it?"
tag_zh = "收入、时间与选择"
tag_en = "Money, time & choices"
summary_zh = "顶包、早期股权、副业，还有陪家人的时间。多赚一点值不值，得放回自己想过的生活里。"
summary_en = "Big offers, early equity, side projects, and time with family. What makes earning more worth the trade?"

[[topic]]
slug = "room-to-live"
number = 48
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "水满则溢：给生活留一点余地"
title_en = "When the cup is full: leaving some room in life"
tag_zh = "生活的余地"
tag_en = "Room to live"
summary_zh = "从《道德经》的一句话聊起：生活塞得太满时，能不能给变化、休息和自己留一点空间？"
summary_en = "A line from the Dao De Jing, and a question about leaving room for change, rest, and ourselves."

[[topic]]
slug = "perspectives"
number = 47
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "人生阶段不同，答案也可以不同"
title_en = "Different stages of life can have different answers"
tag_zh = "人生阶段与选择"
tag_en = "Life stages & choices"
summary_zh = "阶段、处境和时间尺度不同，选择自然不同。求同存异，不急着替彼此下结论。"
summary_en = "Different circumstances and time horizons can lead to different choices. We don't have to leave a conversation with the same answer."

[[topic]]
slug = "self-worth"
number = 46
author = "tianyi-zhang-02"
date = "2026-10-01"
title_zh = "钱很重要，但不必拿它衡量整个人"
title_en = "Money matters. It doesn't have to measure the whole person."
tag_zh = "钱与自我价值"
tag_en = "Money & self-worth"
summary_zh = "钱会影响现实中的选择，但手里暂时少一些钱，不该连对自己的尊重也一起收回去。"
summary_en = "Money affects our options. Having less of it doesn't mean we deserve less respect, including from ourselves."
