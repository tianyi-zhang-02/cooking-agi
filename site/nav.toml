# Single source of truth for the site's navigation.
#
# Adding a note:   drop the .md into a section folder -- it appears automatically.
# Pinning order:   list it in that section's `order`. Unlisted files sort after,
#                  alphabetically, so you only name the ones you care about.
# Adding a section: add a [[section]] block. Nothing else to touch.

[site]
repo        = "tianyi-zhang-02/cooking-agi"
title_zh    = "AGI 学习笔记"
title_en    = "AGI Study Notes"
tagline_zh  = "从一条直线，到会读世界的系统"
tagline_en  = "From a straight line to a system that reads the world"
base_url    = "/cooking-agi"
origin      = "https://tianyi-zhang-02.github.io/cooking-agi"

# The personal homepage this site belongs to. It is the first item of the top bar on every page,
# so the homepage and the notes read as one site.
author_zh   = "张天毅"
author_en   = "Tianyi Zhang"
author_url  = "/"

# Keep previously shared public URLs working after notes move into topic folders.
[redirects]
"open-source/nemo-rl.html" = "open-source/nemo-rl/index.html"
"open-source/nemo-rl.en.html" = "open-source/nemo-rl/index.en.html"

# 三个大类。顶栏的 tab、侧边栏的分组标题和首页的三张入口卡片都来自这里。
# home 是这个大类的落地页；每个 [[group]] 用 category 指到这里的 id。
[[category]]
id = "learn"
zh = "学习笔记"
en = "Study notes"
home = "00-foundations/README.md"
blurb_zh = "大模型基础、系统的各个环节，以及开源项目里的动手实践。"
blurb_en = "LLM foundations, every stage of the system, and hands-on work in open source."

[[category]]
id = "career"
zh = "求职"
en = "Career"
home = "career/README.md"
blurb_zh = "技术面怎么准备，以及我自己找工作的时间线、踩过的坑和岗位认知。"
blurb_en = "How to prepare for technical interviews, plus my own job-search timeline, mistakes and notes on roles."

[[category]]
id = "reference"
zh = "资料"
en = "Reference"
home = "papers/README.md"
blurb_zh = "论文笔记、写作与时效性规范、模板。"
blurb_en = "Paper notes, the editorial and freshness rules, and templates."

# 分组 = 大方向下面的板块。它同时是：页面顶部第二行的板块切换、侧边栏的分组、首页大类卡片里的清单。
# 顺序即显示顺序；每个 [[section]] 用 group 指到这里的 id；home 是点这个板块时落到哪一页（不写就用第一页）。
# 不带 category 的分组（开始）排在最前面，不属于任何大类。
[[group]]
id = "start"
zh = "开始"
en = "Start here"

[[group]]
id = "foundations"
category = "learn"
zh = "大模型基础"
en = "LLM foundations"
home = "00-foundations/README.md"

[[group]]
