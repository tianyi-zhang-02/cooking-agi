# Single source of truth for the site's navigation.
#
# Adding a note:   drop the .md into a section folder -- it appears automatically.
# Pinning order:   list it in that section's `order`. Unlisted files sort after,
#                  alphabetically, so you only name the ones you care about.
# Adding a section: add a [[section]] block. Nothing else to touch.

[site]
repo        = "tianyi-zhang-02/cooking-agi"
title_zh    = "AGI 大锅烩"
title_en    = "Cooking AGI"
tagline_zh  = "从一条直线，到会读世界的系统"
tagline_en  = "From a straight line to a system that reads the world"
base_url    = "/cooking-agi"

# Keep previously shared URLs working after notes move into topic folders.
[redirects]
"practice/offline-online-skew.html" = "practice/recommender-systems/offline-online-skew.html"
"practice/offline-online-skew.en.html" = "practice/recommender-systems/offline-online-skew.en.html"
"practice/positive-negative-design.html" = "practice/recommender-systems/positive-negative-design.html"
"practice/positive-negative-design.en.html" = "practice/recommender-systems/positive-negative-design.en.html"
"practice/negative-pool-size.html" = "practice/recommender-systems/negative-pool-size.html"
"practice/negative-pool-size.en.html" = "practice/recommender-systems/negative-pool-size.en.html"
"practice/two-tower-and-beyond.html" = "practice/recommender-systems/two-tower-and-beyond.html"
"practice/two-tower-and-beyond.en.html" = "practice/recommender-systems/two-tower-and-beyond.en.html"
"practice/data-pipeline-modules.html" = "practice/recommender-systems/data-pipeline-modules.html"
"practice/data-pipeline-modules.en.html" = "practice/recommender-systems/data-pipeline-modules.en.html"
"practice/noise-to-signal-retrieval.html" = "practice/recommender-systems/noise-to-signal-retrieval.html"
"practice/noise-to-signal-retrieval.en.html" = "practice/recommender-systems/noise-to-signal-retrieval.en.html"
"open-source/nemo-rl.html" = "open-source/nemo-rl/index.html"
"open-source/nemo-rl.en.html" = "open-source/nemo-rl/index.en.html"

# 侧边栏的主题分组。顺序即显示顺序；每个 [[section]] 用 group 指到这里的 id。
