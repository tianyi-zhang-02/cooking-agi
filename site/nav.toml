# Single source of truth for the site's navigation.
#
# Adding a note:   drop the .md into a section folder -- it appears automatically.
# Pinning order:   list it in that section's `order`. Unlisted files sort after,
#                  alphabetically, so you only name the ones you care about.
# Adding a section: add a [[section]] block. Nothing else to touch.

[site]
repo        = "tianyi-zhang-02/cooking-agi"
title_zh    = "AGI 学习笔记"
title_en    = "AGI Study Notes"
tagline_zh  = "从基础开始，理解模型怎么工作"
tagline_en  = "From first principles to AI systems that work"
base_url    = "/cooking-agi"
origin      = "https://tianyi-zhang-02.github.io/cooking-agi"

# The notes stand on their own. The maintainer only appears in the contributor universe.
owner_login = "tianyi-zhang-02"
owner_url   = "https://tianyi-zhang-02.github.io/"

# Keep previously shared public URLs working after notes move into topic folders.
[redirects]
# the AI Infra block (open-source/, NeMo RL) was removed on 2026-09-24
"open-source/index.html" = "practice/index.html"
"open-source/index.en.html" = "practice/index.en.html"
"open-source/nemo-rl.html" = "practice/index.html"
"open-source/nemo-rl.en.html" = "practice/index.en.html"
"open-source/nemo-rl/index.html" = "practice/index.html"
"open-source/nemo-rl/index.en.html" = "practice/index.en.html"
"05-post-training/rlhf-pipeline.html" = "05-post-training/rlhf/index.html"
"05-post-training/rlhf-pipeline.en.html" = "05-post-training/rlhf/index.en.html"
"07-evaluation/llm-as-a-judge.html" = "07-evaluation/llm-as-a-judge/index.html"
"07-evaluation/llm-as-a-judge.en.html" = "07-evaluation/llm-as-a-judge/index.en.html"

# home 是这个大类的落地页；每个 [[group]] 用 category 指到这里的 id。
[[category]]
id = "learn"
zh = "学习笔记"
en = "Study notes"
home = "learn/README.md"
blurb_zh = "补基础、学模型、写代码、做设计，按你现在想学的内容开始。"
blurb_en = "Foundations, training and applications, coding exercises, and system design."

[[category]]
id = "practice"
zh = "工程实践"
en = "Industry Practice"
home = "practice/README.md"
blurb_zh = "从 Twitter / X 等公开项目读起，看看每个模块为什么需要、代码里怎样实现。"
blurb_en = "Read public systems end to end, starting with Twitter / X recommendations."

[[category]]
id = "career"
zh = "求职"
en = "Career"
home = "career/README.md"
blurb_zh = "找实习和应届岗位时的经历、心态与选择，也记录走过的弯路。"
blurb_en = "Internship and new-grad journeys, decisions, setbacks, and reflections."

[[category]]
id = "reference"
zh = "论文"
en = "Papers"
home = "papers/README.md"
blurb_zh = "一起读论文：看方法和实验，也聊聊疑问和自己的理解。"
blurb_en = "Papers read one at a time: what a paper actually claims, whether the evidence holds, and what it changes for us."

