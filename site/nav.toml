category = "learn"
zh = "Fine-tuning 与 Post-training"
en = "Fine-tuning & post-training"
home = "05-post-training/README.md"

[[group]]
id = "eval"
category = "learn"
zh = "评估"
en = "Evaluation"
home = "07-evaluation/README.md"

[[group]]
id = "data-retrieval"
category = "learn"
zh = "数据、记忆与检索"
en = "Data, memory & retrieval"
home = "01-data-and-feedback/README.md"

[[group]]
id = "systems"
category = "learn"
zh = "系统、多模态与体验"
en = "Systems, multimodal & experience"
home = "06-systems/README.md"

[[group]]
id = "open-source"
category = "learn"
zh = "开源项目"
en = "Open source"

[[group]]
id = "interview"
category = "career"
zh = "技术面"
