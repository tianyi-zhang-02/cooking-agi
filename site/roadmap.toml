# 首页：职业路线 → tech stack → 知识点。build.py 读这个文件生成 <!-- widget:roadmap -->。
#
# 三层结构：
#   [[layer]]   技术栈里的一层（全站共用一份）。tools 是这一层具体要会的工具 / 技术，
#               topics 是这一层拆出来的知识点。
#   topic       { zh, en, note = "路径.md", anchor = "可选的页内锚点" } 指向一篇笔记；
#               没有 note 的就是还没写，显示成“待补”，不生成链接。
#   [[track]]   一条职业路线 = 从上到下的一摞 layer（上面是岗位专属，下面是通用基础），
#               每层标 weight：core = 必备，plus = 加分。
#
# 规则：
#   - 只链接真的存在的笔记；没写的就让它“待补”，不要包装。
#   - 只有一条路线：MLE / Research Engineer。其它方向不是我的 focus，欢迎别人来扩展（见下）。
#     kind = "main" 会标出“我的主线”。
#   - Data Scientist、Data Engineer、Quant Researcher、AI Infra 等方向不是我的 focus，
#     所以这里没有。欢迎别人来扩展（见下）。
#
# 怎么扩展一条新路线（欢迎 PR）：
#   1. 需要新的技术栈层就加一个 [[layer]]：id、zh、en、tools、topics。
#   2. 加一个 [[track]]：id、zh、en、blurb_zh、blurb_en、layers（从上到下，上面是岗位专属）。
#      不是站点作者本人的路线请写 kind = "side"，并用 by = "你的名字" 署名——页面会如实标出来。
#   3. topic 只有在站内真的有对应笔记时才写 note；否则留空，它会显示成“待补”。
#   4. python3 site/build.py 看一眼首页，再提 PR。

# ───────────────────────────── 知识板块 ─────────────────────────────
