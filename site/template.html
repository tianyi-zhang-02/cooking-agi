<!doctype html>
<html lang="{{lang}}" class="{{dir_class}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_title}}</title>
<meta name="description" content="{{tagline}}">
<link rel="stylesheet" href="{{prefix}}static/style.css?v={{built}}">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script>
  // set the theme before first paint so there is no flash
  (function () {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<a class="skip" href="#content">Skip to content</a>

<header class="topbar">
  <button class="icon-btn menu" aria-label="Menu" aria-expanded="false">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
      <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
  <a class="topbar-brand" href="{{home}}">{{site_title}}</a>
  <div class="topbar-right">
    <a class="lang-btn{{lang_cls}}" href="{{lang_href}}">{{lang_label}}</a>
    <button class="icon-btn theme" aria-label="Theme">
      <svg class="i-sun" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
        <circle cx="10" cy="10" r="3.6" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4"/>
        </g>
      </svg>
      <svg class="i-moon" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
        <path d="M16 11.8A6.5 6.5 0 018.2 4a6.6 6.6 0 102.3 12.9 6.6 6.6 0 005.5-5.1z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>

<div class="shell">

  <aside class="side" id="side">
    <a class="brand" href="{{home}}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="26" height="26">
          <circle cx="14" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5.5 16h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M10 7.5c0-1.6 1.4-1.6 1.4-3.2M14 7.5c0-1.6 1.4-1.6 1.4-3.2M18 7.5c0-1.6 1.4-1.6 1.4-3.2"
                stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".75"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>{{site_title}}</b>
        <i>{{tagline}}</i>
      </span>
    </a>

    <div class="search">
      <input type="search" class="search-input" placeholder="{{search_ph}}"
             autocomplete="off" spellcheck="false" aria-label="{{search_ph}}">
      <div class="search-results" hidden></div>
    </div>

    <nav class="side-nav" aria-label="Sections">
      {{sidebar}}
    </nav>

    <div class="side-foot">
      <a href="https://github.com/{{repo}}">GitHub</a>
      <a class="lang-inline{{lang_cls}}" href="{{lang_href}}">{{lang_label}}</a>
    </div>
  </aside>

  <div class="side-scrim" hidden></div>

  <main id="content">
    <article class="prose">
      {{content}}
      {{glossary}}
    </article>
    {{footer}}
  </main>

  <aside class="rail">
    <div class="rail-inner">
      <div class="rail-title">{{toc_label}}</div>
      <nav class="toc" aria-label="Table of contents">{{toc}}</nav>
    </div>
  </aside>

</div>

<script>window.SITE = { prefix: "{{prefix}}", lang: "{{lang}}", built: "{{built}}" };</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
        crossorigin="anonymous"></script>
<script defer src="{{prefix}}static/app.js"></script>
</body>
</html>
