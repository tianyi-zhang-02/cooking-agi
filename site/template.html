<!doctype html>
<html lang="{{lang}}" class="{{dir_class}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{title}} · {{site_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta name="twitter:card" content="{{twitter_card}}">
<meta name="twitter:title" content="{{title}} · {{site_title}}">
<meta name="twitter:description" content="{{description}}">
{{social_image}}
<meta name="theme-color" content="#0C0A08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Cpath d=%27M4.5 6.5h6.8c1.5 0 2.7 1.2 2.7 2.7v12.3c0-1.5-1.2-2.7-2.7-2.7H4.5z%27 fill=%27none%27 stroke=%27%23E8A672%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M23.5 6.5h-6.8c-1.5 0-2.7 1.2-2.7 2.7v12.3c0-1.5 1.2-2.7 2.7-2.7h6.8z%27 fill=%27none%27 stroke=%27%23E8A672%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{prefix}}static/style.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/review.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/clip-lab.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/traversal-lab.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/recsys-lab.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/recsys-design.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/sidebar.css?v={{built}}">
<link rel="stylesheet" href="{{prefix}}static/search.css?v={{built}}">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
<script>
  // set the theme before first paint so there is no flash
  (function () {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body class="{{page_class}}">


<div class="reading-progress" aria-hidden="true"><span></span></div>

<a class="skip" href="#content">{{skip_label}}</a>

<header class="topbar">
  <button class="icon-btn menu" aria-label="{{menu_label}}" aria-expanded="false" aria-controls="side">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
      <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
  <a class="topbar-brand" href="{{home}}">
    <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
      <path d="M4.5 6.5h6.8c1.5 0 2.7 1.2 2.7 2.7v12.3c0-1.5-1.2-2.7-2.7-2.7H4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M23.5 6.5h-6.8c-1.5 0-2.7 1.2-2.7 2.7v12.3c0-1.5 1.2-2.7 2.7-2.7h6.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span>{{site_title}}</span>
  </a>
  {{tabs}}
  <div class="topbar-right">
    <button type="button" class="icon-btn search-toggle" data-search-open aria-label="{{search_ph}}" aria-haspopup="dialog" aria-controls="note-search" hidden>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    </button>
    <a class="crew-link" href="{{crew_href}}" aria-label="{{crew_aria}}"><span aria-hidden="true">✧</span>{{crew_label}}</a>
    <a class="icon-btn repo-btn" href="https://github.com/{{repo}}" aria-label="GitHub" rel="noopener">
      <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
          1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
          0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 012-.27c.68 0 1.36.09 2
          .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65
          3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
    {{reading_controls}}
    <button class="icon-btn theme" aria-label="{{theme_label}}">
      <svg class="i-sun" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
        <circle cx="10" cy="10" r="3.6" fill="currentColor"/>
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4"/>
        </g>
      </svg>
      <svg class="i-moon" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
        <path d="M16 11.8A6.5 6.5 0 018.2 4a6.6 6.6 0 102.3 12.9 6.6 6.6 0 005.5-5.1z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>

<canvas class="sky" aria-hidden="true"></canvas>

{{hero}}

<div class="shell">

  <aside class="side" id="side">
    <nav class="side-nav" aria-label="{{sidebar_label}}">
      {{sidebar}}
    </nav>
  </aside>

  <div class="side-scrim" hidden></div>

  <main id="content">
    <article class="prose">
      {{page_header}}
      {{mobile_toc}}
      <div class="article-body">
        {{content}}
        {{glossary}}
      </div>
      {{review}}
      {{page_nav}}
    </article>
    {{footer}}
  </main>

  <aside class="rail">
    <div class="rail-inner">
      <div class="rail-title">{{toc_label}}</div>
      <nav class="toc" aria-label="{{toc_label}}">{{toc}}</nav>
    </div>
  </aside>

</div>

<dialog id="note-search" class="note-search" aria-labelledby="note-search-title">
  <div class="note-search-shell">
    <header class="note-search-heading"><h2 id="note-search-title">{{search_ph}}</h2><button type="button" class="note-search-close" aria-label="{{search_close}}">×</button></header>
    <div class="note-search-field">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="note-search-query" type="search" placeholder="{{search_input_ph}}" aria-label="{{search_ph}}" aria-controls="note-search-results" aria-describedby="note-search-status" autocomplete="off" spellcheck="false">
    </div>
    <div class="note-search-tools"><div class="note-search-scopes" role="group" aria-label="{{search_ph}}">
      <button type="button" data-search-scope="current" aria-pressed="true">{{search_current}}</button>
      <button type="button" data-search-scope="all" aria-pressed="false">{{search_all}}</button>
    </div><p id="note-search-status" role="status" aria-live="polite"></p></div>
    <div class="note-search-body"><div class="note-search-empty"></div><ol id="note-search-results" hidden></ol></div>
    <footer class="note-search-footer"><span>{{search_hint}}</span><span>{{search_privacy}}</span></footer>
  </div>
</dialog>
<script>window.SITE = { prefix: "{{prefix}}", lang: "{{lang}}", built: "{{built}}" };</script>
<script defer src="{{prefix}}static/reading.js?v={{built}}"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
        crossorigin="anonymous"></script>
<script defer src="{{prefix}}static/app.js?v={{built}}"></script>
<script defer src="{{prefix}}static/search.js?v={{built}}"></script>
<script defer src="{{prefix}}static/sidebar.js?v={{built}}"></script>
<script defer src="{{prefix}}static/note-reading.js?v={{built}}"></script>
<script defer src="{{prefix}}static/review.js?v={{built}}"></script>
<script defer src="{{prefix}}static/clip-lab.js?v={{built}}"></script>
<script defer src="{{prefix}}static/traversal-lab.js?v={{built}}"></script>
<script defer src="{{prefix}}static/recsys-lab.js?v={{built}}"></script>
<script defer src="{{prefix}}static/recsys-design.js?v={{built}}"></script>
<script defer src="{{prefix}}static/sky.js?v={{built}}"></script>
</body>
</html>
