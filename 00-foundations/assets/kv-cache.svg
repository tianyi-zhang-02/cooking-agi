<text class="sub" x="24" y="262" text-anchor="start">缓存的是 K、V，不是得分矩阵；旧查询不用每步重算。</text>
<text class="sub" x="24" y="280" text-anchor="start">新查询读取 9 个键，遮罩形状是 (1, 9)，不再是方阵。</text>
<text class="sub" x="24" y="296" text-anchor="start">RoPE 要用新 token 的实际位置：这里从 0 编号，应取 8，而不是重新从 0 开始。</text>
