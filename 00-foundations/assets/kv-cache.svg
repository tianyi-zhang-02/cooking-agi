<text class="lbl-s" x="56" y="152.0" text-anchor="end">queries</text>
<text class="lbl" x="330" y="58" text-anchor="start">one decode step, with the cache</text>
<text class="lbl-s" x="330" y="72" text-anchor="start">1 query &#215; 9 keys — the row in ember is all that is computed</text>
