<rect class="box-q" x="530" y="90" width="14" height="12" rx="2"/>
<text class="lbl-s" x="560" y="122" text-anchor="start">computed now</text>
<rect class="box-1" x="530" y="112" width="14" height="12" rx="2"/>
<text class="sub" x="24" y="262" text-anchor="start">Without the cache each new token re-runs the whole prefix: the greyed cells get recomputed every step.</text>
<text class="sub" x="24" y="280" text-anchor="start">The subtle part is the mask. Query 9 sits at absolute position 9 while keys run 1..9, so the mask is (1, 9) — not square —</text>
<text class="sub" x="24" y="296" text-anchor="start">and RoPE's cos/sin must be sliced from position 9, not from 0.</text>
