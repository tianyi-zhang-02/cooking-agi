<text class="lbl-s" x="34" y="160.0" text-anchor="end">token</text>
<text class="lbl-s" x="100.0" y="226" text-anchor="middle">特征 →</text>
<text class="sub" x="24" y="252" text-anchor="start">BatchNorm 训练时用当前批次的统计量；默认评估模式使用累积的统计量。</text>
<text class="sub" x="24" y="268" text-anchor="start">训练时每通道不能只有一个值；[1, C, L] 在 L &gt; 1 时可用，但会混合时间位置。</text>
<text class="sub" x="24" y="284" text-anchor="start">LayerNorm 只看这个 token 自己的特征，不依赖相邻 token。</text>
<text class="sub" x="24" y="306" text-anchor="start">RMSNorm 沿同一条特征轴计算，但不减均值。快多少、效果如何，要实测。</text>
</svg>
