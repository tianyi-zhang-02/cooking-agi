<text class="lbl" x="258" y="78" text-anchor="start">LayerNorm</text>
<text class="lbl-s" x="258" y="93" text-anchor="start">固定一个 token，跨特征计算</text>
<rect class="box-q" x="258" y="110" width="18" height="18" rx="2"/>
