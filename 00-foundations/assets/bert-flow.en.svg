<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" width="580" height="420" role="img" aria-labelledby="title desc">
  <title id="title">One encoder, two pretraining tasks</title>
  <desc id="desc">Corrupted input passes through embeddings and a bidirectional encoder. The MLM head predicts original tokens at selected positions. The NSP head uses pooled CLS to classify segment adjacency. Both losses update the shared encoder.</desc>
  <style>
    :root { --ink:#262a31; --muted:#707783; --line:#cdd2d9; --panel:#f5f6f7; --blue:#2f5d7c; --orange:#b95629; }
    @media(prefers-color-scheme:dark) { :root { --ink:#e5e7eb; --muted:#a0a8b4; --line:#46505d; --panel:#1c2026; --blue:#82b6dc; --orange:#eea276; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); font-size:25px; text-anchor:middle; }
    .small { font-size:22px; fill:var(--muted); }
    .box { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .arrow { stroke:var(--muted); stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .blue { fill:var(--blue); }
    .orange { fill:var(--orange); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="var(--muted)"/></marker></defs>
  <text x="290" y="32">Corrupted tokens + segment / position</text>
  <path d="M290 45 V69" class="arrow"/>
  <rect x="44" y="77" width="492" height="104" rx="10" class="box"/>
  <text x="290" y="115">Embeddings → Bidirectional encoder</text>
  <text x="290" y="152" class="small">One hidden state per position</text>
  <path d="M290 182 V205 H148 V236" class="arrow"/>
  <path d="M290 205 H432 V236" class="arrow"/>
  <rect x="18" y="244" width="260" height="108" rx="10" class="box"/>
  <text x="148" y="277" class="blue">MLM · Selected</text>
  <text x="148" y="309" class="small">Vocabulary logits</text>
  <text x="148" y="339" class="small">Original tokens</text>
  <rect x="302" y="244" width="260" height="108" rx="10" class="box"/>
  <text x="432" y="277" class="orange">NSP · [CLS]</text>
  <text x="432" y="309" class="small">Pooled → 2 logits</text>
  <text x="432" y="339" class="small">Adjacent segments?</text>
  <text x="290" y="400">MLM loss + NSP loss → Update encoder</text>
</svg>
