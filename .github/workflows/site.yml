name: build site

on:
  push:
    branches: [main]
  # Branch protection requires the `build` check, so it has to run on the PR
  # too -- otherwise the check never appears and nothing can ever merge.
  # Every PR gets it, stacked ones too; `closed` only takes the PR's preview down.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  schedule:
    # hourly, so review counts and avatars on the README cards stay current between merges
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # on main only: fetch the preview builds of open pull requests (collect-previews.sh)
      actions: read
      pull-requests: read
    steps:
      # Actions are pinned to commit SHAs: a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # full history: page timestamps and the contributor list come from git log
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Exact versions: the build output is deployed, so a new upstream release
      # must not reach the site without a reviewed change here.
      - run: pip install markdown==3.11 pygments==2.21.0 numpy==2.5.4

      - name: Check collaboration configuration
        run: python site/collaboration.py

      - name: Test site and teaching examples
        run: python -m unittest discover -s site/tests

      # 泄漏检查：本站只有这一个仓库，所有改动都要过这一道。
      # 放在 Build 之前——检查不过就不该产出站点。
      - name: Leak check
        run: python site/leakcheck.py

      - name: Check zh/en parity
        run: python site/paritycheck.py --strict

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/build.py

      - name: Check built pages for script injection
        run: python site/htmlcheck.py

      # Previews of open pull requests deploy with main, under /pr-preview/pr-<N>/.
      - name: Add open pull-request previews
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/collect-previews.sh _site/pr-preview

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    # only main deploys; a PR build is validation, not a release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  # A preview of each pull request from this repository: the same build with --preview (marked,
  # noindex, its own reading records), kept as an artifact for 14 days. The next deploy of main
  # publishes it, so this job starts one. Forks get no preview: their code never runs with a write
  # token or reaches the site's origin.
  preview:
    needs: build
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write          # start the deploy of main
      pull-requests: write    # the comment with the preview link
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install markdown==3.11 pygments==2.21.0 numpy==2.5.4

      - name: Build the preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python site/build.py --preview "$PR"

      - name: Check built pages for script injection
        run: python site/htmlcheck.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: _site
          retention-days: 14

      - name: Deploy main with this preview, and link it on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          gh workflow run site.yml -R "$REPO" --ref main
          bash .github/scripts/preview-comment.sh live

  # A closed pull request: the next deploy of main leaves its preview out; start one now.
  unpreview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Take the preview down
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          gh workflow run site.yml -R "$REPO" --ref main
          bash .github/scripts/preview-comment.sh removed
