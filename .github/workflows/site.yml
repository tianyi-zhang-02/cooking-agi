name: build site

on:
  push:
    branches: [main]
  # Branch protection requires the `build` check, so it has to run on the PR
  # too -- otherwise the check never appears and nothing can ever merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: page timestamps and the contributor list come from git log
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install markdown pygments

      # 泄漏兜底。挡的是不走 promote 脚本的路径：手改、复制粘贴、另一台机器。
      # 放在 Build 之前——检查不过就不该产出站点。
      - name: Leak check
        run: python site/leakcheck.py

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # only main deploys; a PR build is validation, not a release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
