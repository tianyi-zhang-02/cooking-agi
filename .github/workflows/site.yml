name: build site

on:
  push:
    branches: [main]
  # Branch protection requires the `build` check, so it has to run on the PR
  # too -- otherwise the check never appears and nothing can ever merge.
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # full history: page timestamps and the contributor list come from git log
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Exact versions: the build output is deployed, so a new upstream release
      # must not reach the site without a reviewed change here.
      - run: pip install markdown==3.11 pygments==2.21.0 numpy==2.5.4

      - name: Check collaboration configuration
        run: python site/collaboration.py

      - name: Test site and teaching examples
        run: python -m unittest discover -s site/tests

      # 泄漏兜底。挡的是不走 promote 脚本的路径：手改、复制粘贴、另一台机器。
      # 放在 Build 之前——检查不过就不该产出站点。
      - name: Leak check
        run: python site/leakcheck.py

      - name: Check zh/en parity
        run: python site/paritycheck.py --strict

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/build.py

      - name: Check built pages for script injection
        run: python site/htmlcheck.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    # only main deploys; a PR build is validation, not a release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
