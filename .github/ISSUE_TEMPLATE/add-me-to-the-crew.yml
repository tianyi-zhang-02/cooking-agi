name: 贡献署名 · Credit
description: 补充审阅、纠错等没有出现在提交记录里的贡献署名。 / Add a credit for a review, correction or other contribution.
title: "[Credit] @your-github-login"
body:
  - type: markdown
    attributes:
      value: 提交作者会自动出现在 README 的贡献者卡片里。这里补充审阅、纠错等不在提交记录里的贡献。 / Commit authors appear automatically on the README's contributor card. Use this form for reviews, corrections and other contributions git does not record.
  - type: input
    id: login
    attributes:
      label: GitHub 用户名 · GitHub login
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 贡献与依据 · Contribution and evidence
      description: 附本仓库 issue / PR 链接。 / Link the issues or PRs.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 同意公开 · Consent
      options:
        - label: 这是我本人的请求，或已得到被署名者同意；提交的信息将公开。 / This is my request or I have the credited person's consent; submitted information is public.
          required: true
