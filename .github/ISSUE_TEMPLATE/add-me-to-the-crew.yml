name: 加我进船员名单 · Add me to the crew
description: 做过贡献之后，用这个开一个 issue，我会不定期读、然后手动加进去。 / After contributing, open one of these; I read them periodically and add you by hand.
title: "crew: @your-github-login"
labels: ["crew"]
body:
  - type: markdown
    attributes:
      value: |
        名字本来就会自动出现在[幕后船员](../../blob/main/contributors.md)页面上，点名字跳你的 GitHub 主页，
        还会拿到一个编号（`CG 001` 这种，按第一次出现的先后排）——这些都不用登记。

        这个 issue 只为一件事：**国家或地区**，用来点亮那张世界地图。

        **不要直接改 `crew.toml`。** 那个文件我自己维护，直接改它的 PR 不会合；开这个 issue 就行。

        ---

        Your name already shows up on the [contributors page](../../blob/main/contributors.md) on its own,
        linking to your GitHub profile, and picks up a catalogue number (`CG 001`, in order of first
        appearance) — none of that needs signing up for.

        This issue is for one thing: a **country or region**, which lights one patch of the world map.

        **Please don't edit `crew.toml` directly.** I maintain that file and PRs touching it are not
        merged. This issue is the way.
  - type: input
    id: login
    attributes:
      label: GitHub 用户名 · GitHub login
      placeholder: your-github-login
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: 国家/地区 · Country or region
      description: ISO 3166-1 两位字母，只用来点亮地图。 / ISO 3166-1 alpha-2, only used for the map.
      placeholder: SG
    validations:
      required: true
  - type: checkboxes
    id: ground-rules
    attributes:
      label: 守则 · Ground rules
      description: 见 [CONTRIBUTING](../../blob/main/CONTRIBUTING.md)。 / See [CONTRIBUTING](../../blob/main/CONTRIBUTING.md).
      options:
        - label: 只谈技术，不谈政治，也不拿这儿当广告位。 / Technical subjects only — no politics, and not an advertising slot.
          required: true
        - label: 用 AI 起草可以，但我会自己把每一行读过再发。 / Drafting with AI is fine, but I read every line myself before sending it.
          required: true
        - label: 我知道破了守则的后果是名字永久移出名单。 / I understand that breaking these rules takes my name off the list permanently.
          required: true
  - type: textarea
    id: anything
    attributes:
      label: 还想说点什么 · Anything else
      description: 可以不填。 / Optional.
