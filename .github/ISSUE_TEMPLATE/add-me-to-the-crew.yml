name: 贡献记录与地图 · Credit and map
description: 补充贡献署名，或添加、更改、移除自愿提供的位置。 / Add a credit or manage an optional location.
title: "[Credit] @your-github-login"
body:
  - type: markdown
    attributes:
      value: 提交作者会自动出现在幕后。这里也接收审阅、纠错等贡献记录；位置可不填，请勿填写地址。 / Commit authors appear automatically. Reviews and corrections count too. Location is optional; do not share an address.
  - type: input
    id: login
    attributes:
      label: GitHub 用户名 · GitHub login
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 贡献与依据 · Contribution and evidence
      description: 附本仓库 issue / PR 链接；只改位置可写“不适用”。 / Link issues or PRs here; write N/A for location-only requests.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: 位置（可选）· Location (optional)
      description: 国家/地区两位代码，如 US 或 CN, US；也可以写 remove。 / Two-letter country/region codes or remove.
  - type: checkboxes
    id: consent
    attributes:
      label: 同意公开 · Consent
      options:
        - label: 这是我本人的请求，或已得到被署名者同意；提交的信息将公开。 / This is my request or I have the credited person's consent; submitted information is public.
          required: true
