name: 提问与纠错 · Note feedback
description: 哪段没讲清、哪里可能有错，都可以从这里聊。 / Ask about a note or report a correction.
title: "[Note] "
body:
  - type: input
    id: area
    attributes:
      label: 板块 · Area
      description: "保留 Area: 前缀，方便分区检索。可用 foundations / posttrain / evaluation / data-retrieval / systems-agents / practice / career / papers / site。"
      placeholder: "Area: evaluation"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 页面 · Source
      description: 页面底部入口会自动填写。中文和英文使用同一中文源文件路径。 / Prefilled from a page; both languages use its canonical Chinese source path.
      placeholder: 07-evaluation/README.md
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 想讨论什么 · Question or correction
      description: 引用具体段落，说明疑问；有公开依据或复现步骤可以一起贴。 / Quote the passage, explain the issue, and add public evidence if available.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容 · Public content
      options:
        - label: 不包含内部资料、凭据或他人隐私。 / No internal materials, credentials, or other people's private data.
          required: true
